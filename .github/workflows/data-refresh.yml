name: Data refresh

# Weekly: download fresh ATRAI + OSM data, rebuild every output, and publish it only when all
# gates in qa/gates.py pass. A failed run changes nothing; GitHub notifies the repo owners.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt

      # Last good Overpass response: osm.run() falls back to it when Overpass is down.
      - name: Restore OSM cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/osm_overpass.json
          key: osm-overpass-${{ github.run_id }}
          restore-keys: osm-overpass-

      - name: Run pipeline with a fresh download
        working-directory: pipeline
        run: python run.py --all --refresh

      - name: Save OSM cache
        uses: actions/cache/save@v4
        with:
          path: data/raw/osm_overpass.json
          key: osm-overpass-${{ github.run_id }}

      - name: Gates
        id: gates
        run: python qa/gates.py

      - name: Publish
        if: steps.gates.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/out web/public/data web/public/report.pdf qa/top10-check.md
          git commit -m "data: refresh $(date -u +%F)"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Data refresh"
            echo "Gates: ${{ steps.gates.outcome }}, published: ${{ steps.gates.outputs.changed || 'false' }}"
            echo
            cat qa/top10-check.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
