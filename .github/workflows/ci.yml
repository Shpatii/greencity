name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline and data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Unit tests
        working-directory: pipeline
        run: python -m pytest -q
      - name: Committed data matches the contract
        working-directory: pipeline
        run: python -m safelane.validate ../web/public/data --mode full --expect-source atrai
      - name: Data checks (A3-A9)
        run: python qa/check_data.py

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            qa/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        run: npm run type-check
      - name: Unit tests
        working-directory: web
        run: npm test -- --ci
      - name: Build static site
        working-directory: web
        run: npm run build
      - name: score.ts parity on the published data (B11)
        run: node qa/parity_real.mjs
      - name: types.ts matches the contract (B13)
        run: node qa/contract_drift.mjs
      - name: Install Playwright
        working-directory: qa
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser checks on the static build (B12)
        run: |
          node web/scripts/serve.mjs web/out 4173 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node qa/e2e.mjs --url http://localhost:4173
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: qa/screens/
